<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Original document reader | The Unanswered Referral</title><link rel="stylesheet" href="publication.css"><link rel="stylesheet" href="origami.css"><script defer src="publication.js"></script><script defer src="origami.js"></script><script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><style>
:root{--paper:#f7f5f0;--line:#d3ddd5;--accent:#245d58}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:#1d2928;font:18px/1.77 Georgia,serif}
a{color:var(--accent)}.reader{max-width:1280px;margin:auto;padding:48px 24px 100px;display:grid;grid-template-columns:245px minmax(0,800px);gap:60px}.rail{align-self:start;position:sticky;top:24px;max-height:calc(100vh - 40px);overflow-y:auto;padding-right:16px;border-right:1px solid var(--line);font:13px/1.5 system-ui,sans-serif}.rail h2{font:800 11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}.rail nav a{display:block;padding:8px 5px;text-decoration:none;border-bottom:1px solid #e2e7e0}.rail nav a:hover{text-decoration:underline}.main{min-width:0}.eyebrow{font:750 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.17em;color:var(--accent)}h1#document-title{font:normal clamp(37px,5vw,58px)/1.13 Georgia,serif;letter-spacing:-.035em;margin:18px 0 20px}.intro{font:14px/1.55 system-ui,sans-serif;color:#56665b;border-bottom:1px solid var(--line);padding-bottom:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 30px;font:650 12px system-ui,sans-serif}.actions a,.actions button{background:white;border:1px solid var(--line);padding:11px 14px;text-decoration:none;font:inherit;color:var(--accent);cursor:pointer}.content h1{font:normal 34px/1.25 Georgia,serif}.content h2{font:normal 30px/1.25 Georgia,serif;margin-top:45px}.content h3{font:600 22px/1.3 Georgia,serif}.content p{margin:0 0 23px}.content li{margin-bottom:9px}.content :where(ol,ul){padding-left:26px}.content blockquote{margin:23px 0;padding:6px 20px;border-left:3px solid #9fb7a6}.content table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font:13px/1.5 system-ui,sans-serif}.content th,.content td{border:1px solid var(--line);padding:10px;text-align:left}.content pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid var(--line);padding:16px}.content a{overflow-wrap:anywhere}
@media(max-width:900px){.reader{display:block;padding:30px 17px 80px}.rail{position:static;max-height:260px;overflow:auto;padding:10px 0 20px;margin-bottom:24px;border:0;border-bottom:1px solid var(--line)}}
@media print{.reader{display:block;padding:0}.rail,.actions,.intro{display:none!important}.content h2{break-after:avoid}}
</style></head><body><div class="reader"><aside class="rail" aria-label="Document contents"><h2>On this page</h2><nav id="toc"></nav></aside><main class="main" id="publication-main"><div class="eyebrow">Original source · Unaltered Markdown</div><h1 id="document-title">Document reader</h1><p class="intro">This reader presents the original Markdown file without changing its text. For the unmediated source, use “Open original Markdown”.</p><div class="actions"><a href="library.html">All documents</a><a id="source" href="library.html">Open original Markdown</a><button type="button" id="print">Print / save PDF</button></div><article class="content publication-prose" id="content"><p role="status">Loading original document…</p></article></main></div>
<script>
document.addEventListener('DOMContentLoaded',async function(){
const allowed=["CASE_FOR_DELIBERATE_MISREPRESENTATION.md","DOCUMENTARY_SOURCE_INDEX.md","JULY_2017_CLINICAL_RECORD_SOURCE_RECONSTRUCTION.md","REPOSITORY_COMPLETION_PLAN.md","THE_POSITIVE_FINDING_AND_THE_PERIPHERAL_HYPOTHESIS.md","THE_UNANSWERED_REFERRAL.md","THE_UNANSWERED_REFERRAL_CANONICAL_WORKING_CASE.md"];
const path=new URLSearchParams(location.search).get('file');
const content=document.getElementById('content'),title=document.getElementById('document-title'),sourceLink=document.getElementById('source'),toc=document.getElementById('toc');
document.getElementById('print').addEventListener('click',()=>window.print());
if(!allowed.includes(path)){title.textContent='Document not found';content.textContent='Return to the complete library to choose an original document.';return}
sourceLink.href=path;title.textContent=path.replace(/\.md$/,'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,s=>s.toUpperCase());document.title=title.textContent+' | The Unanswered Referral';
try{const r=await fetch(path);if(!r.ok)throw Error('Document unavailable');const original=await r.text();
if(window.marked&&window.DOMPurify){content.innerHTML=DOMPurify.sanitize(marked.parse(original),{USE_PROFILES:{html:true}})}
else{const pre=document.createElement('pre');pre.textContent=original;content.replaceChildren(pre)}
const used=new Map();content.querySelectorAll('h1,h2,h3,h4').forEach(h=>{let slug=(h.textContent||'section').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,75)||'section',n=used.get(slug)||0;used.set(slug,n+1);h.id=n?slug+'-'+(n+1):slug;let a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;if(h.tagName==='H3')a.style.paddingLeft='15px';toc.append(a)});
if(window.Origami){window.Origami.foldDocument(content);window.Origami.revealHash()}
}catch(e){content.textContent='The reader could not load the document. Use the original Markdown link above.'}
});
</script></body></html>
